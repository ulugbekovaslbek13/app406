<!DOCTYPE html>
<html>
<head>
  <title>Cyber Snake</title>
  <style>
    body { background: #030508; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    canvas { border: 2px solid #58a6ff; box-shadow: 0 0 20px #58a6ff; background: #0d1117; }
  </style>
</head>
<body>
<canvas id="game" width="400" height="400"></canvas>
<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let grid = 20, snake = [{x:160, y:160}], dx = grid, dy = 0, apple = {x:300, y:300}, score = 0;
  
  function main() {
    setTimeout(function onTick() {
      clearCanvas(); drawApple(); moveSnake(); drawSnake();
      if (hasKey()) return; main();
    }, 100);
  }
  function clearCanvas() { ctx.fillStyle = '#0d1117'; ctx.fillRect(0,0,400,400); }
  function drawSnake() { ctx.fillStyle = '#56d364'; snake.forEach(s => ctx.fillRect(s.x, s.y, grid-2, grid-2)); }
  function moveSnake() {
    const head = {x: snake[0].x + dx, y: snake[0].y + dy};
    snake.unshift(head);
    if(head.x === apple.x && head.y === apple.y) {
      apple.x = Math.floor(Math.random()*20)*grid; apple.y = Math.floor(Math.random()*20)*grid;
    } else { snake.pop(); }
  }
  function drawApple() { ctx.fillStyle = '#f85149'; ctx.fillRect(apple.x, apple.y, grid-2, grid-2); }
  function hasKey() {
    const leftWall = snake[0].x < 0, rightWall = snake[0].x >= 400, topWall = snake[0].y < 0, bottomWall = snake[0].y >= 400;
    return leftWall || rightWall || topWall || bottomWall;
  }
  window.addEventListener('keydown', e => {
    if(e.keyCode===37 && dx===0) {dx=-grid; dy=0} if(e.keyCode===38 && dy===0) {dx=0; dy=-grid}
    if(e.keyCode===39 && dx===0) {dx=grid; dy=0} if(e.keyCode===40 && dy===0) {dx=0; dy=grid}
  });
  main();
</script>
</body>
</html>
